name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'pip==26.2.1'
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q src
      - run: python -m pytest -q


  workstation-relay-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install 'pip==26.2.1'
      - run: python -m pip install -e '.[test,workstation-relay]'
      - run: python -m compileall -q src
      - run: python -c "import uiautomation; import radar.windows_firefox_target"
      - run: python -m pytest -q tests/radar/test_workstation_relay.py tests/radar/test_windows_firefox_target.py
