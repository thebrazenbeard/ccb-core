name: Edge Deno import check

on:
  pull_request:
    paths:
      - .github/workflows/edge-deno-check.yml
      - supabase/functions/github-bus-ingest/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-deno-check:
    name: edge-deno-check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Deno runtime
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.8

      - name: Type-check complete Edge import graph with frozen lock
        working-directory: supabase/functions/github-bus-ingest
        run: deno check --frozen-lockfile index.ts
